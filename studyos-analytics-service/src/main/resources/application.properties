# StudyOS Analytics Service configuration
server.port=8081

# Point this at the SAME MongoDB instance/database used by the Node/Express backend
# (matches the MONGODB_URI used in the main StudyOS backend .env)
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/studyos

# Optional: nicer error messages during development
server.error.include-message=always
